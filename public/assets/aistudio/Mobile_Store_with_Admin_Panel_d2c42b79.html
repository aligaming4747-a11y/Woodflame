if(!S||!S.products)S=DEF();
let cart=[];try{cart=JSON.parse(localStorage.getItem(KEY+'c'))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'c',JSON.stringify(cart))}catch(e){alert('Storage is full. Delete some images or products.')}};
let V={page:'home',pid:null,img:0,qty:1,cart:false,menu:false,tab:'dash',edit:null,last:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>S.settings.cur+' '+Number(n||0).toLocaleString('en-US');
const prod=id=>S.products.find(p=>p.id===id);
const stars=(n,s)=>`<span class="st">${[1,2,3,4,5].map(i=>`<span class="${i<=n?'':'e'}">${I('star',s||14)}</span>`).join('')}</span>`;
const sub=()=>cart.reduce((a,c)=>a+(prod(c.id)?prod(c.id).price*c.q:0),0);
const go=(p,id)=>{V.page=p;V.menu=false;if(id){V.pid=id;V.img=0;V.qty=1}V.cart=false;render();scrollTo(0,0)};
const goSec=id=>{V.menu=false;if(V.page!=='home'){V.page='home';render()}setTimeout(()=>{const e=$(id);if(e)e.scrollIntoView({behavior:'smooth'})},30)};
function fileToData(f,max){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,(max||900)/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=fr.result};fr.readAsDataURL(f)})}

function cardH(p){const sale=p.compare>p.price;return `<div class="card" onclick="go('product','${p.id}')">${!p.stock?'<span class="badge oos">SOLD OUT</span>':sale?'<span class="badge">SALE</span>':''}<img src="${p.images[0]||ph('No image','#888')}" alt="${esc(p.name)}" loading="lazy"><div class="in"><div class="n">${esc(p.name)}</div>${stars(p.rating)}<div class="pr">${fmt(p.price)}${sale?`<s>${fmt(p.compare)}</s>`:''}</div></div></div>`}

function header(){const n=cart.reduce((a,c)=>a+c.q,0);const L=[['Home',"go('home')"],['Products',"goSec('all')"],['Reviews',"goSec('rev')"],['Contact',"goSec('contact')"]];
return `${S.settings.bar?`<div class="bar">${esc(S.settings.bar)}</div>`:''}<header><div class="w"><div class="logo" onclick="go('home')"><span class="lg">${I('pkg',18)}</span>${esc(S.settings.name)}</div><nav>${L.map(l=>`<a onclick="${l[1]}">${l[0]}</a>`).join('')}</nav><div><button class="ib" onclick="V.cart=true;render()" aria-label="Cart">${I('cart',22)}${n?`<span class="cnt">${n}</span>`:''}</button><button class="ib mbtn" onclick="V.menu=!V.menu;render()" aria-label="Menu">${I(V.menu?'x':'menu',22)}</button></div></div><div class="mn ${V.menu?'on':''}">${L.map(l=>`<a onclick="${l[1]}">${l[0]}</a>`).join('')}</div></header>`}

function footer(){const s=S.settings;const soc=[['fb','fb'],['ig','ig'],['yt','yt']].filter(x=>s[x[0]]).map(x=>`<a href="${esc(s[x[0]])}" target="_blank" rel="noopener" aria-label="${x[0]}">${I(x[1],18)}</a>`).join('');
return `<footer id="contact"><div class="w"><div class="cols"><div><div class="logo" style="color:#fff;margin-bottom:12px"><span class="lg">${I('pkg',18)}</span>${esc(s.name)}</div><p style="margin:0;max-width:340px">${esc(s.about)}</p><div class="so">${soc}<a href="https://wa.me/${esc(s.wa)}" target="_blank" rel="noopener" aria-label="WhatsApp">${I('wa',18)}</a></div></div>
<div><h4>Quick links</h4><ul><li><a onclick="go('home')">Home</a></li><li><a onclick="goSec('all')">All products</a></li><li><a onclick="goSec('rev')">Customer reviews</a></li><li><a onclick="V.cart=true;render()">My cart</a></li></ul></div>
<div><h4>Contact us</h4><ul><li>${I('phone',17)}<a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></li><li>${I('mail',17)}<a href="mailto:${esc(s.email)}">${esc(s.email)}</a></li><li>${I('pin',17)}<span>${esc(s.address)}</span></li><li>${I('wa',17)}<a href="https://wa.me/${esc(s.wa)}" target="_blank" rel="noopener">Chat on WhatsApp</a></li></ul></div>
<div><h4>Why shop with us</h4><ul><li>${I('truck',17)}Nationwide delivery</li><li>${I('shield',17)}Damage protection</li><li>${I('refresh',17)}Easy replacements</li></ul></div></div>
<div class="fb"><span>© ${new Date().getFullYear()} ${esc(s.name)}. All rights reserved.</span><div class="pays"><span>Cash on Delivery</span><span>Bank Transfer</span></div><a onclick="openAdmin()">Admin panel</a></div></div></footer><a class="wa" href="https://wa.me/${esc(s.wa)}" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">${I('wa',30)}</a>`}

function home(){const s=S.settings;const avg=S.reviews.length?(S.reviews.reduce((a,r)=>a+r.r,0)/S.reviews.length).toFixed(2):0;
return `<div class="hero" style="${s.heroImg?`background-image:url(${s.heroImg})`:''}"><div class="w"><h1>${esc(s.hero)}</h1><p>${esc(s.sub)}</p><a class="btn" onclick="goSec('all')">${esc(s.heroBtn)} ${I('arrow',18)}</a></div></div>
<div class="w"><div class="feat">${s.feats.map(f=>`<div><span class="fi">${I(f.i,24)}</span><p style="margin:0"><b>${esc(f.t)}</b><span>${esc(f.d)}</span></p></div>`).join('')}</div>
<h2 class="sec" id="all">All Products</h2><p class="sub">Browse our collection</p>${S.products.length?`<div class="grid">${S.products.map(cardH).join('')}</div>`:'<p class="tc">No products yet. Add some from the admin panel.</p>'}
${S.gallery.length?`<h2 class="sec">In Action</h2><p class="sub">See our products in real use</p><div class="car">${S.gallery.map(g=>`<div><img src="${g.img}" alt="" loading="lazy"><em>${esc(g.t)}</em></div>`).join('')}</div>`:''}
${S.reviews.length?`<h2 class="sec" id="rev">Customer Reviews</h2><div class="rt">${stars(Math.round(avg),18)}<b style="color:var(--tx)">${avg}</b> out of 5</div><div class="rv">${S.reviews.map(r=>`<div>${stars(r.r)}<p>${esc(r.t)}</p><small>— ${esc(r.n)}</small></div>`).join('')}</div>`:''}</div>`}

function productPage(){const p=prod(V.pid);if(!p)return '<div class="tc">Product not found.</div>';const sale=p.compare>p.price;const im=p.images.length?p.images:[ph('No image','#888')];const sim=S.products.filter(x=>x.id!==p.id).slice(0,4);const d=p.stock?'':'disabled';
return `<div class="w"><p style="margin:14px 0 0"><a onclick="go('home')" style="color:var(--mu);cursor:pointer;display:inline-flex;gap:6px;align-items:center">${I('back',16)} Back to store</a></p><div class="pg"><div><img class="main" src="${im[V.img]||im[0]}" alt=""><div class="th">${im.map((x,i)=>`<img src="${x}" class="${i===V.img?'on':''}" onclick="V.img=${i};render()" alt="">`).join('')}</div></div>
<div><h1 style="font-size:26px;margin:0 0 6px;letter-spacing:-.5px">${esc(p.name)}</h1>${stars(p.rating,16)}<div class="pr" style="font-size:22px;margin:8px 0">${fmt(p.price)}${sale?`<s>${fmt(p.compare)}</s>`:''}</div>
<p style="margin:6px 0 14px"><span class="dot ${p.stock?'':'r'}"></span>${p.stock?'In stock':'Out of stock'}</p><div class="desc">${esc(p.desc)}</div>
<div class="row"><div class="q"><button onclick="V.qty=Math.max(1,V.qty-1);render()" aria-label="Less">${I('minus',16)}</button><span>${V.qty}</span><button onclick="V.qty++;render()" aria-label="More">${I('plus',16)}</button></div><button class="btn" ${d} onclick="addCart('${p.id}',V.qty,false)">${I('cart',18)} Add to cart</button></div>
<button class="btn dk full" ${d} onclick="addCart('${p.id}',V.qty,true)">Buy it now</button>
<div class="cm"><h4>OUR COMMITMENT</h4><div><span>${I('truck',26)}Delivery Nationwide</span><span>${I('shield',26)}Damage Protection</span><span>${I('refresh',26)}Easy Replacements</span></div></div>
${p.specs.length?`<details open><summary>${I('cog',18)} Technical Specifications</summary><table>${p.specs.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</table></details>`:''}
</div></div>${sim.length?`<h2 class="sec">Similar Products</h2><div class="grid" style="margin-top:20px">${sim.map(cardH).join('')}</div>`:''}</div>`}

function addCart(id,q,now){const c=cart.find(x=>x.id===id);if(c)c.q+=q;else cart.push({id,q});save();if(now)go('checkout');else{V.cart=true;render()}}
function cartQ(id,d){const c=cart.find(x=>x.id===id);c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!==id);save();render()}
function cartDrawer(){if(!V.cart)return '';cart=cart.filter(c=>prod(c.id));return `<div class="ov" onclick="V.cart=false;render()"></div><div class="dr"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Your cart</h3><button class="ib" onclick="V.cart=false;render()" aria-label="Close">${I('x',22)}</button></div><div class="ls">${cart.length?cart.map(c=>{const p=prod(c.id);return `<div class="ci"><img src="${p.images[0]||ph('','#888')}" alt=""><div>${esc(p.name)}<br><b>${fmt(p.price)}</b></div><div class="q"><button onclick="cartQ('${c.id}',-1)">${I('minus',14)}</button><span>${c.q}</span><button onclick="cartQ('${c.id}',1)">${I('plus',14)}</button></div></div>`}).join(''):`<p class="tc">${I('cart',40)}<br>Your cart is empty.</p>`}</div>${cart.length?`<div style="display:flex;justify-content:space-between;margin:10px 0"><b>Subtotal</b><b>${fmt(sub())}</b></div><button class="btn full" onclick="go('checkout')">Checkout ${I('arrow',18)}</button>`:''}</div>`}

function checkout(){if(!cart.length)return `<div class="tc"><h2 style="color:var(--tx)">Your cart is empty</h2><button class="btn" onclick="go('home')">Continue shopping</button></div>`;const sh=+S.settings.ship||0;
return `<div class="w"><p style="margin:14px 0 0"><a onclick="go('home')" style="color:var(--mu);cursor:pointer;display:inline-flex;gap:6px;align-items:center">${I('back',16)} Continue shopping</a></p><div class="co"><div><h3 class="h">${I('phone',20)} Contact</h3><input id="f_ph" type="tel" placeholder="Mobile phone number"><h3 class="h">${I('pin',20)} Delivery</h3><div class="two"><input id="f_fn" placeholder="First name"><input id="f_ln" placeholder="Last name"></div><label>Address</label><input id="f_ad"><div class="two"><div><label>City</label><input id="f_ct"></div><div><label>Postal code (optional)</label><input id="f_pc"></div></div>
<h3 class="h">${I('truck',20)} Shipping method</h3><div class="box sel" style="display:flex;justify-content:space-between"><span>Standard (5–7 working days)</span><b>${fmt(sh)}</b></div>
<h3 class="h">${I('card',20)} Payment</h3><label class="box sel" id="pm1" style="color:var(--tx);font-size:15px;font-weight:500"><input type="radio" name="pm" value="COD" checked onchange="pmSel()"> COD (Delivery charges advance)<br><small style="color:var(--mu)">Pay the delivery charges in advance. The remaining amount is paid in cash on delivery.</small></label><label class="box" id="pm2" style="color:var(--tx);font-size:15px;font-weight:500"><input type="radio" name="pm" value="Bank Transfer" onchange="pmSel()"> Bank Transfer<div id="bk" style="display:none;white-space:pre-line;color:var(--mu);font-weight:400;margin-top:8px">${esc(S.settings.bank)}</div></label></div>
<div><div class="box"><h3 style="margin-top:0">Order summary</h3>${cart.map(c=>{const p=prod(c.id);return p?`<div class="ci"><img src="${p.images[0]||ph('','#888')}" alt=""><div>${esc(p.name)} × ${c.q}</div><b>${fmt(p.price*c.q)}</b></div>`:''}).join('')}<div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>${fmt(sub())}</span></div><div style="display:flex;justify-content:space-between"><span>Shipping</span><span>${fmt(sh)}</span></div><div style="display:flex;justify-content:space-between;font-size:19px;margin-top:8px"><b>Total</b><b>${fmt(sub()+sh)}</b></div></div><button class="btn dk full" onclick="placeOrder()">${I('check',18)} Complete order</button></div></div></div>`}
function pmSel(){const v=document.querySelector('[name=pm]:checked').value;$('pm1').className='box'+(v==='COD'?' sel':'');$('pm2').className='box'+(v!=='COD'?' sel':'');$('bk').style.display=v==='COD'?'none':'block'}
function placeOrder(){const g=i=>$(i).value.trim();if(!g('f_ph')||!g('f_fn')||!g('f_ad')||!g('f_ct')){alert('Please fill in phone, first name, address and city.');return}
const sh=+S.settings.ship||0;const o={id:'#'+(1001+S.orders.length),date:new Date().toLocaleString(),name:g('f_fn')+' '+g('f_ln'),phone:g('f_ph'),address:g('f_ad')+', '+g('f_ct')+' '+g('f_pc'),pay:document.querySelector('[name=pm]:checked').value,status:'New',items:cart.map(c=>({name:prod(c.id).name,q:c.q,price:prod(c.id).price})),total:sub()+sh};
S.orders.unshift(o);V.last=o;cart=[];save();go('thanks')}
function thanks(){const o=V.last;return `<div class="tc"><div class="ok">${I('check',40)}</div><h2 style="color:var(--tx);margin:0 0 6px">Thank you!</h2><p>Your order ${o?esc(o.id):''} has been placed. We will contact you shortly to confirm.</p><button class="btn" onclick="go('home')">Continue shopping</button></div>`}

/* ---------- ADMIN (no login) ---------- */
function openAdmin(){V.page='admin';V.tab='dash';render();scrollTo(0,0)}
function admin(){const T=[['dash','chart','Dashboard'],['products','pkg','Products'],['orders','card','Orders ('+S.orders.length+')'],['gallery','img','Gallery'],['reviews','chat','Reviews'],['settings','cog','Settings']];
return `<div class="w ad"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Admin panel</h2><button class="btn sm ol" onclick="go('home')">${I('home',15)} View store</button></div><div class="tabs">${T.map(t=>`<button class="${V.tab===t[0]?'on':''}" onclick="V.tab='${t[0]}';V.edit=null;render()">${I(t[1],16)} ${t[2]}</button>`).join('')}</div>${({dash,products:plist,orders:olist,gallery:glist,reviews:rlist,settings:settingsForm})[V.tab]()}</div>`}
function dash(){const rev=S.orders.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+o.total,0);const st=[['pkg',S.products.length,'Products'],['card',S.orders.length,'Total orders'],['chart',fmt(rev),'Revenue'],['refresh',S.orders.filter(o=>o.status==='New').length,'New orders']];
return `<div class="stats">${st.map(s=>`<div>${I(s[0],22)}<b>${s[1]}</b><span>${s[2]}</span></div>`).join('')}</div><p class="hint" style="margin-top:18px">Manage everything from the tabs above: products, orders, the “In Action” gallery, customer reviews, and all store settings (hero, trust blocks, footer, contact, payment). Changes save automatically and show on the store immediately.</p>`}
function plist(){return `<button class="btn" onclick="newP()">${I('plus',18)} Add product</button>${S.products.map(p=>`<div class="li"><img src="${p.images[0]||ph('','#888')}" alt=""><div><b>${esc(p.name)}</b><br><span class="hint">${fmt(p.price)} · ${p.stock?'In stock':'Out of stock'}</span></div><div class="ac"><button class="btn sm ol" onclick="editP('${p.id}')" aria-label="Edit">${I('edit',16)}</button><button class="btn sm dg" onclick="delP('${p.id}')" aria-label="Delete">${I('trash',16)}</button></div></div>`).join('')}`}
function newP(){V.edit={id:'p'+Date.now(),name:'',price:0,compare:0,stock:true,rating:5,images:[],desc:'',specs:[],isNew:true};render()}
function editP(id){V.edit=JSON.parse(JSON.stringify(prod(id)));render()}
function delP(id){if(confirm('Delete this product?')){S.products=S.products.filter(p=>p.id!==id);cart=cart.filter(c=>c.id!==id);save();render()}}
function pl(){return plist}
function editForm(){const e=V.edit;return `<div class="box"><h3 style="margin-top:0">${e.isNew?'New':'Edit'} product</h3><label>Name</label><input value="${esc(e.name)}" oninput="V.edit.name=this.value"><div class="two"><div><label>Price</label><input type="number" value="${e.price}" oninput="V.edit.price=+this.value"></div><div><label>Old price (for sale badge)</label><input type="number" value="${e.compare}" oninput="V.edit.compare=+this.value"></div></div>
<div class="two"><div><label>Rating (1–5)</label><input type="number" min="1" max="5" value="${e.rating}" oninput="V.edit.rating=Math.min(5,Math.max(1,+this.value||5))"></div><div><label>Availability</label><select onchange="V.edit.stock=this.value==='1'"><option value="1" ${e.stock?'selected':''}>In stock</option><option value="0" ${e.stock?'':'selected'}>Out of stock</option></select></div></div>
<label>Description</label><textarea rows="6" oninput="V.edit.desc=this.value">${esc(e.desc)}</textarea>
<label>Specifications (one per line: Name: Value)</label><textarea rows="5" oninput="V.edit.specs=this.value.split('\\n').filter(l=>l.includes(':')).map(l=>[l.split(':')[0].trim(),l.split(':').slice(1).join(':').trim()])">${esc(e.specs.map(r=>r[0]+': '+r[1]).join('\n'))}</textarea>
<label>Images (first image is the cover)</label><div>${e.images.map((x,i)=>`<span class="ti"><img src="${x}" alt=""><button onclick="V.edit.images.splice(${i},1);render()" aria-label="Remove">${I('x',13)}</button></span>`).join('')||'<span class="hint">No images yet.</span>'}</div><input type="file" accept="image/*" multiple onchange="addImgs(this)" style="margin-top:8px">
<div class="row"><button class="btn" onclick="saveP()">${I('check',18)} Save product</button><button class="btn ol" onclick="V.edit=null;render()">Cancel</button></div></div>`}
const _pl=plist;plist=function(){return V.edit?editForm():_pl()};
async function addImgs(inp){for(const f of inp.files)V.edit.images.push(await fileToData(f,900));render()}
function saveP(){const e=V.edit;if(!e.name.trim()){alert('Enter a product name.');return}const n=e.isNew;delete e.isNew;if(n)S.products.unshift(e);else S.products=S.products.map(p=>p.id===e.id?e:p);V.edit=null;save();render()}
function olist(){return S.orders.length?S.orders.map((o,i)=>`<div class="box"><div style="display:flex;justify-content:space-between"><b>${esc(o.id)}</b><small class="hint">${esc(o.date)}</small></div><p style="margin:8px 0">${esc(o.name)} · <a href="tel:${esc(o.phone)}" style="text-decoration:underline">${esc(o.phone)}</a><br>${esc(o.address)}<br>Payment: ${esc(o.pay)}</p>${o.items.map(x=>`<div>${esc(x.name)} × ${x.q}</div>`).join('')}<p><b>Total: ${fmt(o.total)}</b></p><div class="row"><select onchange="S.orders[${i}].status=this.value;save();render()">${['New','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn sm dg" style="flex:none" onclick="if(confirm('Delete order?')){S.orders.splice(${i},1);save();render()}">${I('trash',16)}</button></div></div>`).join(''):'<p class="tc">No orders yet.</p>'}
function glist(){return `<label>Add images to the “In Action” gallery</label><input type="file" accept="image/*" multiple onchange="addG(this)">${S.gallery.map((g,i)=>`<div class="li"><img src="${g.img}" alt=""><div><input value="${esc(g.t)}" placeholder="Caption" oninput="S.gallery[${i}].t=this.value" onchange="save()"></div><button class="btn sm dg" onclick="S.gallery.splice(${i},1);save();render()">${I('trash',16)}</button></div>`).join('')||'<p class="tc">Gallery is empty (the section is hidden on the store).</p>'}`}
async function addG(inp){for(const f of inp.files)S.gallery.push({img:await fileToData(f,900),t:''});save();render()}
function rlist(){return `<button class="btn" onclick="S.reviews.unshift({n:'Customer',r:5,t:'Great product!'});save();render()">${I('plus',18)} Add review</button>${S.reviews.map((r,i)=>`<div class="box"><div class="two"><input value="${esc(r.n)}" placeholder="Name" oninput="S.reviews[${i}].n=this.value" onchange="save()"><select onchange="S.reviews[${i}].r=+this.value;save()">${[5,4,3,2,1].map(n=>`<option value="${n}" ${r.r===n?'selected':''}>${n} stars</option>`).join('')}</select></div><textarea rows="3" style="margin-top:8px" oninput="S.reviews[${i}].t=this.value" onchange="save()">${esc(r.t)}</textarea><button class="btn sm dg" style="margin-top:8px" onclick="S.reviews.splice(${i},1);save();render()">${I('trash',16)} Delete</button></div>`).join('')}`}
function settingsForm(){const s=S.settings;const f=(k,l,t)=>`<label>${l}</label><input ${t?`type="${t}"`:''} value="${esc(s[k])}" oninput="S.settings.${k}=${t==='number'?'+this.value':'this.value'}" onchange="save()">`;const ta=(k,l,r)=>`<label>${l}</label><textarea rows="${r}" oninput="S.settings.${k}=this.value" onchange="save()">${esc(s[k])}</textarea>`;
return `<p class="hint">Changes save automatically.</p><div class="box"><h3 class="h" style="margin-top:0">${I('home',20)} Store &amp; hero</h3>${f('name','Store name')}${f('bar','Announcement bar text (leave empty to hide)')}${f('hero','Hero title')}${f('sub','Hero subtitle')}${f('heroBtn','Hero button text')}<label>Hero background image</label>${s.heroImg?`<span class="ti"><img src="${s.heroImg}" alt=""><button onclick="S.settings.heroImg='';save();render()">${I('x',13)}</button></span>`:''}<input type="file" accept="image/*" onchange="heroUp(this)"></div>
<div class="box"><h3 class="h" style="margin-top:0">${I('award',20)} Trust blocks</h3>${s.feats.map((x,i)=>`<label>Block ${i+1}</label><div class="two"><select onchange="S.settings.feats[${i}].i=this.value;save()">${[['truck','Truck'],['award','Award'],['shield','Shield'],['refresh','Refresh']].map(o=>`<option value="${o[0]}" ${x.i===o[0]?'selected':''}>${o[1]} icon</option>`).join('')}</select><input value="${esc(x.t)}" oninput="S.settings.feats[${i}].t=this.value" onchange="save()"></div><input style="margin-top:6px" value="${esc(x.d)}" oninput="S.settings.feats[${i}].d=this.value" onchange="save()">`).join('')}</div>
<div class="box"><h3 class="h" style="margin-top:0">${I('phone',20)} Contact &amp; footer</h3>${f('phone','Phone')}${f('email','Email')}${f('address','Address')}${f('wa','WhatsApp number (country code, digits only)')}${ta('about','About text (footer)',3)}${f('fb','Facebook link')}${f('ig','Instagram link')}${f('yt','YouTube link')}</div>
<div class="box"><h3 class="h" style="margin-top:0">${I('card',20)} Shipping &amp; payment</h3>${f('cur','Currency symbol')}${f('ship','Shipping fee','number')}${ta('bank','Bank transfer details (shown at checkout)',4)}</div>

async function heroUp(inp){if(inp.files[0]){S.settings.heroImg=await fileToData(inp.files[0],1400);save();render()}}

function render(){const p=V.page;let h;
if(p==='admin')h=admin();
else h=header()+(p==='home'?home():p==='product'?productPage():p==='checkout'?checkout():thanks())+footer()+cartDrawer();
$('app').innerHTML=h;document.title=S.settings.name}
if(location.hash==='#admin')V.page='admin';
render();

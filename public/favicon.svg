<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="innerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Subtle glow beneath flame -->
  <circle cx="32" cy="40" r="16" fill="#f97316" opacity="0.25" filter="url(#glow)"/>

  <!-- Outer Flame Body -->
  <path d="M32 9 C35 17 46 25 46 37 C46 47 39.5 53 32 53 C24.5 53 18 47 18 37 C18 29 23 23 26 18 C27 22 29 24 31 23 C34 19 32 13 32 9 Z" fill="url(#flameGrad)" />

  <!-- Inner Dynamic Flame Core -->
  <path d="M32 27 C34 32 40 37 40 43 C40 48 36.5 51 32 51 C27.5 51 24 48 24 43 C24 38 28 34 29 32 C30 34 31 35 32 35 C33 32 32 29 32 27 Z" fill="url(#innerFlame)" opacity="0.9" />

  <!-- Wood Log Base Accent -->
  <path d="M22 51 C25 49 39 49 42 51" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
</svg>
